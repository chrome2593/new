<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대구교통공사 냉동기 가동 점검</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; margin: 20px; background-color: #f0f2f5; color: #333; }
        .container { max-width: 1200px; margin: auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { color: #0054a6; text-align: center; border-bottom: 2px solid #0054a6; padding-bottom: 15px; margin-bottom: 25px; }
        .upload-section { border: 2px dashed #0054a6; padding: 40px; text-align: center; border-radius: 10px; margin-bottom: 20px; cursor: pointer; background-color: #fdfdfd; }
        .upload-section:hover { background-color: #f1f7ff; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #0054a6; color: white; position: sticky; top: 0; }
        .status-error { background-color: #ffe6e6; color: #d93d30; font-weight: bold; }
        .status-none { color: #ccc; }
        .line-info-tag { display: inline-block; padding: 6px 20px; border-radius: 50px; color: white; font-weight: bold; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>냉동기 가동시간 이상 점검 (전체 역사)</h2>
    
    <div class="upload-section" onclick="document.getElementById('excelFile').click()">
        <strong>가동일보 엑셀(XLS/XLSX)을 업로드하세요.</strong>
        <p style="font-size: 0.9em; color: #666;">1호선(가동시간), 2호선(장비), 공통(냉동기) 시트 자동 분석</p>
        <input type="file" id="excelFile" style="display:none;" accept=".xls, .xlsx" />
    </div>

    <div id="resultArea" style="display:none;">
        <div id="lineBadge" class="line-info-tag"></div>
        <table>
            <thead>
                <tr>
                    <th style="width: 45px;">순번</th>
                    <th>역사명</th>
                    <th>냉동기 가동시간 합계(h)</th>
                    <th>기준값(h)</th>
                    <th>상태 결과</th>
                </tr>
            </thead>
            <tbody id="resultBody"></tbody>
        </table>
    </div>
</div>

<script>
    // 1호선 전체 역사 (설화명곡 ~ 하양) - 가로형 배열 반영
    const line1Map = [
        { name: "설화명곡", cells: ["E26", "F26"], limit: 12 }, { name: "화원", cells: ["G26", "H26"], limit: 12 },
        { name: "대곡", cells: ["I26", "J26"], limit: 12 }, { name: "진천", cells: ["K26", "L26"], limit: 12 },
        { name: "월배", cells: ["M26", "N26"], limit: 12 }, { name: "상인", cells: ["O26", "P26"], limit: 12 },
        { name: "월촌", cells: ["Q26", "R26"], limit: 12 }, { name: "송현", cells: ["S26", "T26"], limit: 12 },
        { name: "서부정류장", cells: ["U26", "V26"], limit: 12 }, { name: "대명", cells: ["W26", "X26"], limit: 12 },
        { name: "안지랑", cells: ["Y26", "Z26"], limit: 12 }, { name: "현충로", cells: ["AA26", "AB26"], limit: 12 },
        { name: "영대병원", cells: ["AC26", "AD26"], limit: 12 }, { name: "교대", cells: ["AE26", "AF26"], limit: 12 },
        { name: "명덕", cells: ["AG26", "AH26"], limit: 14 }, { name: "반월당", cells: ["AI26", "AJ26"], limit: 14 },
        { name: "중앙로", cells: [], limit: 0 }, { name: "대구역", cells: [], limit: 0 }, { name: "칠성시장", cells: [], limit: 0 },
        { name: "신천", cells: [], limit: 0 }, { name: "동대구역", cells: [], limit: 0 }, { name: "동구청", cells: [], limit: 0 },
        { name: "아양교", cells: [], limit: 0 }, { name: "동촌", cells: [], limit: 0 }, { name: "해안", cells: [], limit: 0 },
        { name: "방촌", cells: [], limit: 0 }, { name: "용계", cells: [], limit: 0 }, { name: "율하", cells: [], limit: 0 },
        { name: "신기", cells: [], limit: 0 }, { name: "반야월", cells: [], limit: 0 }, { name: "각산", cells: [], limit: 0 },
        { name: "안심", cells: [], limit: 0 }, { name: "대구한의대병원", cells: [], limit: 0 }, { name: "부호경일대", cells: [], limit: 0 }, { name: "하양대구가톨릭대", cells: [] , limit: 0}
    ];

    // 2호선 전체 역사 (문양 ~ 영남대) - 블록형 배열 반영
    const line2Map = [
        { name: "문양", cells: ["E6", "E7"], limit: 10 }, { name: "다사", cells: ["E20", "E21"], limit: 10 },
        { name: "대실", cells: ["E34", "E35"], limit: 10 }, { name: "강창", cells: ["E48", "E49"], limit: 10 },
        { name: "계명대", cells: ["J6", "J7"], limit: 12 }, { name: "성서산업단지", cells: ["J20", "J21"], limit: 12 },
        { name: "이곡", cells: ["J34", "J35"], limit: 12 }, { name: "용산", cells: ["J48", "J49"], limit: 12 },
        { name: "죽전", cells: ["O6", "O7"], limit: 12 }, { name: "감삼", cells: ["O20", "O21"], limit: 12 },
        { name: "두류", cells: ["O34", "O35"], limit: 12 }, { name: "내당", cells: ["O48", "O49"], limit: 12 },
        { name: "반고개", cells: ["T6", "T7"], limit: 12 }, { name: "청라언덕", cells: ["T20", "T21"], limit: 12 },
        { name: "반월당", cells: ["T34", "T35"], limit: 15 }, { name: "경대병원", cells: ["T48", "T49"], limit: 12 },
        { name: "범어", cells: [], limit: 0 }, { name: "수성구청", cells: [], limit: 0 }, { name: "만촌", cells: [], limit: 0 },
        { name: "담티", cells: [], limit: 0 }, { name: "연호", cells: [], limit: 0 }, { name: "대공원", cells: [], limit: 0 },
        { name: "고산", cells: [], limit: 0 }, { name: "신매", cells: [], limit: 0 }, { name: "사월", cells: [], limit: 0 },
        { name: "정평", cells: [], limit: 0 }, { name: "임당", cells: [], limit: 0 }, { name: "영남대", cells: [], limit: 0 }
    ];

    document.getElementById('excelFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(evt) {
            const data = evt.target.result;
            const workbook = XLSX.read(data, { type: 'binary' });
            analyzeWorkbook(workbook);
        };
        reader.readAsBinaryString(file);
    });

    function analyzeWorkbook(workbook) {
        let activeStations = [];
        let sheetName = "";
        let lineLabel = "";
        let themeColor = "";

        // 시트 감지 로직 (가동시간/장비/냉동기)
        if (workbook.SheetNames.includes("가동시간")) {
            activeStations = line1Map;
            sheetName = "가동시간";
            lineLabel = "1호선 (설화명곡 ~ 하양)";
            themeColor = "#d93d30";
        } else if (workbook.SheetNames.includes("장비")) {
            activeStations = line2Map;
            sheetName = "장비";
            lineLabel = "2호선 (문양 ~ 영남대)";
            themeColor = "#00aa3c";
        } else if (workbook.SheetNames.includes("냉동기")) {
            // "냉동기"라는 이름의 시트가 있을 경우에도 처리 (파일 내용에 따라 호선 자동 판별 필요하나 기본 1호선 구조 가정)
            activeStations = line1Map; 
            sheetName = "냉동기";
            lineLabel = "기계분야 냉동기 시트 분석";
            themeColor = "#0054a6";
        } else {
            alert("냉동기 데이터를 확인할 수 있는 시트가 없습니다.");
            return;
        }

        const badge = document.getElementById('lineBadge');
        badge.innerText = lineLabel;
        badge.style.backgroundColor = themeColor;

        const sheet = workbook.Sheets[sheetName];
        const tbody = document.getElementById('resultBody');
        tbody.innerHTML = "";

        activeStations.forEach((st, idx) => {
            let totalVal = 0;
            let foundData = false;

            if (st.cells.length > 0) {
                st.cells.forEach(cellId => {
                    const cell = sheet[cellId];
                    if (cell && cell.v !== undefined) {
                        const numericVal = parseFloat(cell.v);
                        if (!isNaN(numericVal)) {
                            totalVal += (numericVal * 24); // 엑셀 시간값을 시간 단위로 변환
                            foundData = true;
                        }
                    }
                });
            }

            const tr = document.createElement('tr');
            const isOverLimit = foundData && totalVal > st.limit;
            
            let statusDisp = "정상";
            if (!foundData) statusDisp = "-";
            else if (isOverLimit) statusDisp = "이상 (초과)";

            tr.innerHTML = `
                <td>${idx + 1}</td>
                <td style="text-align: left; padding-left: 20px;">${st.name}</td>
                <td class="${!foundData ? 'status-none' : ''}">${foundData ? totalVal.toFixed(2) : '-'}</td>
                <td class="${st.limit === 0 ? 'status-none' : ''}">${st.limit > 0 ? st.limit : '-'}</td>
                <td class="${isOverLimit ? 'status-error' : (!foundData ? 'status-none' : '')}">${statusDisp}</td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('resultArea').style.display = "block";
    }
</script>

</body>
</html>
