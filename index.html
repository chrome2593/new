<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>냉동기 가동시간 점검 시스템</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; margin: 20px; background-color: #f4f7f9; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #0054a6; text-align: center; margin-bottom: 10px; }
        .file-input-wrapper { text-align: center; border: 2px dashed #0054a6; padding: 40px; border-radius: 10px; margin-bottom: 20px; cursor: pointer; transition: 0.3s; }
        .file-input-wrapper:hover { background-color: #eef5ff; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; table-layout: fixed; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; word-break: keep-all; }
        th { background-color: #0054a6; color: white; font-size: 0.9em; }
        .status-error { background-color: #ffe6e6; color: #d93d30; font-weight: bold; }
        .status-none { color: #ccc; }
        .line-info { margin-bottom: 15px; font-weight: bold; font-size: 1.1em; color: #333; }
    </style>
</head>
<body>

<div class="container">
    <h1>냉동기 가동시간 이상 점검</h1>
    
    <div class="file-input-wrapper" onclick="document.getElementById('excelFile').click()">
        <strong>가동일보 엑셀 파일을 업로드하세요.</strong>
        <p style="color: #666; font-size: 0.9em;">(1호선: 가동시간 시트 / 2호선: 장비 시트 자동 감지)</p>
        <input type="file" id="excelFile" style="display:none;" accept=".xls, .xlsx" />
    </div>

    <div id="resultArea" style="display:none;">
        <div id="activeLine" class="line-info"></div>
        <table>
            <thead>
                <tr>
                    <th style="width: 50px;">순번</th>
                    <th>역사명</th>
                    <th>가동시간 합계(h)</th>
                    <th>기준값(h)</th>
                    <th>판단 결과</th>
                </tr>
            </thead>
            <tbody id="resultBody"></tbody>
        </table>
    </div>
</div>

<script>
    // 사진 데이터 기반 역사별 셀 위치 및 기준치 (전체 역사 순서)
    const line1Data = [
        { name: "설화명곡", cells: ["E26", "F26"], limit: 12 }, { name: "화원", cells: ["G26", "H26"], limit: 12 },
        { name: "대곡", cells: ["I26", "J26"], limit: 12 }, { name: "진천", cells: ["K26", "L26"], limit: 12 },
        { name: "월배", cells: ["M26", "N26"], limit: 12 }, { name: "상인", cells: ["O26", "P26"], limit: 12 },
        { name: "월촌", cells: ["Q26", "R26"], limit: 12 }, { name: "송현", cells: ["S26", "T26"], limit: 12 },
        { name: "서부정류장", cells: ["U26", "V26"], limit: 12 }, { name: "대명", cells: ["W26", "X26"], limit: 12 },
        { name: "안지랑", cells: ["Y26", "Z26"], limit: 12 }, { name: "현충로", cells: ["AA26", "AB26"], limit: 12 },
        { name: "영대병원", cells: ["AC26", "AD26"], limit: 12 }, { name: "교대", cells: ["AE26", "AF26"], limit: 12 },
        { name: "명덕", cells: ["AG26", "AH26"], limit: 14 }, { name: "반월당", cells: ["AI26", "AJ26"], limit: 14 },
        { name: "중앙로", cells: [], limit: 0 }, { name: "대구역", cells: [], limit: 0 }, { name: "칠성시장", cells: [], limit: 0 },
        { name: "신천", cells: [], limit: 0 }, { name: "동대구역", cells: [], limit: 0 }, { name: "동구청", cells: [], limit: 0 },
        { name: "아양교", cells: [], limit: 0 }, { name: "동촌", cells: [], limit: 0 }, { name: "해안", cells: [], limit: 0 },
        { name: "방촌", cells: [], limit: 0 }, { name: "용계", cells: [], limit: 0 }, { name: "율하", cells: [], limit: 0 },
        { name: "신기", cells: [], limit: 0 }, { name: "반야월", cells: [], limit: 0 }, { name: "각산", cells: [], limit: 0 },
        { name: "안심", cells: [], limit: 0 }, { name: "대구한의대병원", cells: [], limit: 0 }, { name: "부호", cells: [], limit: 0 }, { name: "하양", cells: [], limit: 0 }
    ];

    const line2Data = [
        { name: "문양", cells: ["E6", "E7"], limit: 10 }, { name: "다사", cells: ["E20", "E21"], limit: 10 },
        { name: "대실", cells: ["E34", "E35"], limit: 10 }, { name: "강창", cells: ["E48", "E49"], limit: 10 },
        { name: "계명대", cells: ["J6", "J7"], limit: 12 }, { name: "성서산업단지", cells: ["J20", "J21"], limit: 12 },
        { name: "이곡", cells: ["J34", "J35"], limit: 12 }, { name: "용산", cells: ["J48", "J49"], limit: 12 },
        { name: "죽전", cells: ["O6", "O7"], limit: 12 }, { name: "감삼", cells: ["O20", "O21"], limit: 12 },
        { name: "두류", cells: ["O34", "O35"], limit: 12 }, { name: "내당", cells: ["O48", "O49"], limit: 12 },
        { name: "반고개", cells: ["T6", "T7"], limit: 12 }, { name: "청라언덕", cells: ["T20", "T21"], limit: 12 },
        { name: "반월당", cells: ["T34", "T35"], limit: 15 }, { name: "경대병원", cells: ["T48", "T49"], limit: 12 },
        { name: "범어", cells: [], limit: 0 }, { name: "수성구청", cells: [], limit: 0 }, { name: "만촌", cells: [], limit: 0 },
        { name: "담티", cells: [], limit: 0 }, { name: "연호", cells: [], limit: 0 }, { name: "대공원", cells: [], limit: 0 },
        { name: "고산", cells: [], limit: 0 }, { name: "신매", cells: [], limit: 0 }, { name: "사월", cells: [], limit: 0 },
        { name: "정평", cells: [], limit: 0 }, { name: "임당", cells: [], limit: 0 }, { name: "영남대", cells: [], limit: 0 }
    ];

    document.getElementById('excelFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(evt) {
            const data = evt.target.result;
            const workbook = XLSX.read(data, { type: 'binary' });
            renderTable(workbook);
        };
        reader.readAsBinaryString(file);
    });

    function renderTable(workbook) {
        let selectedLine = "";
        let stations = [];
        let sheetName = "";

        // 호선 판별 로직
        if (workbook.SheetNames.includes("가동시간")) {
            selectedLine = "1호선 (설화명곡 ~ 하양)";
            stations = line1Data;
            sheetName = "가동시간";
        } else if (workbook.SheetNames.includes("장비")) {
            selectedLine = "2호선 (문양 ~ 영남대)";
            stations = line2Data;
            sheetName = "장비";
        } else {
            alert("냉동기 데이터를 추출할 수 없는 시트 형식입니다.");
            return;
        }

        document.getElementById('activeLine').innerText = "현재 분석 호선: " + selectedLine;
        const sheet = workbook.Sheets[sheetName];
        const tbody = document.getElementById('resultBody');
        tbody.innerHTML = "";

        stations.forEach((st, index) => {
            let totalHours = 0;
            let hasDevice = st.cells.length > 0;
            let actualDataFound = false;

            if (hasDevice) {
                st.cells.forEach(cellAddr => {
                    const cell = sheet[cellAddr];
                    if (cell && cell.v !== undefined) {
                        const val = parseFloat(cell.v);
                        if (!isNaN(val)) {
                            totalHours += (val * 24); // 엑셀 시간값을 시간단위로 변환
                            actualDataFound = true;
                        }
                    }
                });
            }

            const tr = document.createElement('tr');
            const isError = actualDataFound && totalHours > st.limit;
            
            let statusText = "정상";
            if (!hasDevice || !actualDataFound) statusText = "-";
            else if (isError) statusText = "이상 (초과)";

            tr.innerHTML = `
                <td>${index + 1}</td>
                <td>${st.name}</td>
                <td class="${!actualDataFound ? 'status-none' : ''}">${actualDataFound ? totalHours.toFixed(2) : '-'}</td>
                <td class="${st.limit === 0 ? 'status-none' : ''}">${st.limit > 0 ? st.limit : '-'}</td>
                <td class="${isError ? 'status-error' : (!actualDataFound ? 'status-none' : '')}">${statusText}</td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('resultArea').style.display = "block";
    }
</script>

</body>
</html>
