<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>냉동기 가동시간 분석 시스템</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; margin: 20px; background-color: #f8f9fa; color: #333; }
        .container { max-width: 1000px; margin: auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #0054a6; text-align: center; border-bottom: 2px solid #0054a6; padding-bottom: 15px; margin-bottom: 20px; }
        .file-upload { border: 2px dashed #0054a6; padding: 30px; text-align: center; border-radius: 10px; margin-bottom: 30px; cursor: pointer; }
        .file-upload:hover { background-color: #f1f7ff; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.95em; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: center; }
        th { background-color: #f2f2f2; font-weight: bold; }
        .line-1-header { border-top: 3px solid #d93d30; } /* 1호선 색상 */
        .line-2-header { border-top: 3px solid #00aa3c; } /* 2호선 색상 */
        .status-error { color: #d93d30; font-weight: bold; background-color: #fff0f0; }
        .status-none { color: #aaa; }
        .summary { margin-bottom: 10px; font-weight: bold; color: #555; }
    </style>
</head>
<body>

<div class="container">
    <h2>가동일보 냉동기 가동시간 점검</h2>
    
    <div class="file-upload" onclick="document.getElementById('excelFile').click()">
        <strong>가동일보 파일(Excel)을 클릭하여 선택하거나 여기로 드래그하세요.</strong>
        <input type="file" id="excelFile" style="display:none;" accept=".xls, .xlsx" />
    </div>

    <div id="resultArea" style="display:none;">
        <div class="summary" id="fileInfo"></div>
        <table id="resultTable">
            <thead>
                <tr id="tableHeaderLine">
                    <th>순번</th>
                    <th>역사명</th>
                    <th>가동시간 합계 (h)</th>
                    <th>기준값 (h)</th>
                    <th>상태</th>
                </tr>
            </thead>
            <tbody id="resultBody"></tbody>
        </table>
    </div>
</div>

<script>
    // 1호선 역사 리스트 및 기준 데이터 (설화명곡 ~ 하양)
    const line1Stations = [
        { name: "설화명곡", cells: ["E26", "F26"], limit: 12 }, { name: "화원", cells: ["G26", "H26"], limit: 12 },
        { name: "대곡", cells: ["I26", "J26"], limit: 12 }, { name: "진천", cells: ["K26", "L26"], limit: 12 },
        { name: "월배", cells: ["M26", "N26"], limit: 12 }, { name: "상인", cells: ["O26", "P26"], limit: 12 },
        { name: "월촌", cells: ["Q26", "R26"], limit: 12 }, { name: "송현", cells: ["S26", "T26"], limit: 12 },
        { name: "서부정류장", cells: ["U26", "V26"], limit: 12 }, { name: "대명", cells: ["W26", "X26"], limit: 12 },
        { name: "안지랑", cells: ["Y26", "Z26"], limit: 12 }, { name: "현충로", cells: ["AA26", "AB26"], limit: 12 },
        { name: "영대병원", cells: ["AC26", "AD26"], limit: 12 }, { name: "교대", cells: ["AE26", "AF26"], limit: 12 },
        { name: "명덕", cells: ["AG26", "AH26"], limit: 14 }, { name: "반월당", cells: ["AI26", "AJ26"], limit: 14 },
        { name: "중앙로", cells: [], limit: 0 }, { name: "대구역", cells: [], limit: 0 },
        { name: "칠성시장", cells: [], limit: 0 }, { name: "신천", cells: [], limit: 0 },
        { name: "동대구역", cells: [], limit: 0 }, { name: "동구청", cells: [], limit: 0 },
        { name: "아양교", cells: [], limit: 0 }, { name: "동촌", cells: [], limit: 0 },
        { name: "해안", cells: [], limit: 0 }, { name: "방촌", cells: [], limit: 0 },
        { name: "용계", cells: [], limit: 0 }, { name: "율하", cells: [], limit: 0 },
        { name: "신기", cells: [], limit: 0 }, { name: "반야월", cells: [], limit: 0 },
        { name: "각산", cells: [], limit: 0 }, { name: "안심", cells: [], limit: 0 },
        { name: "대구한의대병원", cells: [], limit: 0 }, { name: "부호경일대대구가톨릭대", cells: [], limit: 0 }, { name: "하양대구가톨릭대", cells: [], limit: 0 }
    ];

    // 2호선 역사 리스트 및 기준 데이터 (문양 ~ 영남대)
    const line2Stations = [
        { name: "문양", cells: ["E6", "E7"], limit: 10 }, { name: "다사", cells: ["E20", "E21"], limit: 10 },
        { name: "대실", cells: ["E34", "E35"], limit: 10 }, { name: "강창", cells: ["E48", "E49"], limit: 10 },
        { name: "계명대", cells: ["J6", "J7"], limit: 12 }, { name: "성서산업단지", cells: ["J20", "J21"], limit: 12 },
        { name: "이곡", cells: ["J34", "J35"], limit: 12 }, { name: "용산", cells: ["J48", "J49"], limit: 12 },
        { name: "죽전", cells: ["O6", "O7"], limit: 12 }, { name: "감삼", cells: ["O20", "O21"], limit: 12 },
        { name: "두류", cells: ["O34", "O35"], limit: 12 }, { name: "내당", cells: ["O48", "O49"], limit: 12 },
        { name: "반고개", cells: ["T6", "T7"], limit: 12 }, { name: "청라언덕", cells: ["T20", "T21"], limit: 12 },
        { name: "반월당", cells: ["T34", "T35"], limit: 15 }, { name: "경대병원", cells: ["T48", "T49"], limit: 12 },
        { name: "범어", cells: [], limit: 0 }, { name: "수성구청", cells: [], limit: 0 },
        { name: "만촌", cells: [], limit: 0 }, { name: "담티", cells: [], limit: 0 },
        { name: "연호", cells: [], limit: 0 }, { name: "대공원", cells: [], limit: 0 },
        { name: "고산", cells: [], limit: 0 }, { name: "신매", cells: [], limit: 0 },
        { name: "사월", cells: [], limit: 0 }, { name: "정평", cells: [], limit: 0 },
        { name: "임당", cells: [], limit: 0 }, { name: "영남대", cells: [], limit: 0 }
    ];

    document.getElementById('excelFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(evt) {
            const data = evt.target.result;
            const workbook = XLSX.read(data, { type: 'binary' });
            processWorkbook(workbook, file.name);
        };
        reader.readAsBinaryString(file);
    });

    function processWorkbook(workbook, fileName) {
        let activeStations = [];
        let sheetName = "";
        let headerClass = "";

        if (workbook.SheetNames.includes("가동시간")) {
            activeStations = line1Stations;
            sheetName = "가동시간";
            headerClass = "line-1-header";
            document.getElementById('fileInfo').innerText = "분석 대상: 1호선 (" + fileName + ")";
        } else if (workbook.SheetNames.includes("장비")) {
            activeStations = line2Stations;
            sheetName = "장비";
            headerClass = "line-2-header";
            document.getElementById('fileInfo').innerText = "분석 대상: 2호선 (" + fileName + ")";
        } else {
            alert("일보 형식이 맞지 않습니다. '가동시간' 또는 '장비' 시트가 필요합니다.");
            return;
        }

        const sheet = workbook.Sheets[sheetName];
        const tbody = document.getElementById('resultBody');
        const headerRow = document.getElementById('tableHeaderLine');
        headerRow.className = headerClass;
        tbody.innerHTML = "";

        activeStations.forEach((st, index) => {
            let totalHours = 0;
            let hasData = false;

            if (st.cells.length > 0) {
                st.cells.forEach(cellRef => {
                    const cell = sheet[cellRef];
                    if (cell && cell.v !== undefined) {
                        const val = parseFloat(cell.v);
                        if (!isNaN(val)) {
                            totalHours += (val * 24); // 엑셀 시간 형식을 시간 단위로 변환
                            hasData = true;
                        }
                    }
                });
            }

            const tr = document.createElement('tr');
            const isError = hasData && totalHours > st.limit;
            
            tr.innerHTML = `
                <td>${index + 1}</td>
                <td>${st.name}</td>
                <td class="${hasData ? '' : 'status-none'}">${hasData ? totalHours.toFixed(1) : '-'}</td>
                <td class="${st.limit > 0 ? '' : 'status-none'}">${st.limit > 0 ? st.limit : '-'}</td>
                <td class="${isError ? 'status-error' : (hasData ? '' : 'status-none')}">
                    ${!hasData ? '-' : (isError ? '이상 (시간 초과)' : '정상')}
                </td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('resultArea').style.display = "block";
    }
</script>

</body>
</html>
